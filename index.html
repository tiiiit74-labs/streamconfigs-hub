<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StreamConfigs Hub v0.8.1</title>
<style>
/* ══════════════════════════════════════════════
   STREAMCONFIGS HUB v0.8
   Utilitarian-refined terminal aesthetic
   IBM Plex Mono + IBM Plex Sans
══════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg:   #050810;
  --s1:   #080e1c;
  --s2:   #0c1526;
  --s3:   #111e30;
  --s4:   #16253a;
  --s5:   #1b2d45;

  --b1: rgba(90,140,210,.08);
  --b2: rgba(90,140,210,.15);
  --b3: rgba(90,140,210,.26);
  --b4: rgba(90,140,210,.42);

  --t1: #d4e6ff;
  --t2: #6a8eb0;
  --t3: #344e68;
  --t4: #1c2e42;

  --amber:    #f0a500;
  --amber-l:  #f5c040;
  --amber-bg: rgba(240,165,0,.08);
  --amber-bd: rgba(240,165,0,.24);

  --green:    #20d06e;
  --green-bg: rgba(32,208,110,.09);
  --green-bd: rgba(32,208,110,.24);

  --red:      #ff4356;
  --red-bg:   rgba(255,67,86,.09);
  --red-bd:   rgba(255,67,86,.22);

  --blue:     #4a9eff;
  --blue-bg:  rgba(74,158,255,.09);
  --blue-bd:  rgba(74,158,255,.22);

  --orange:    #ff7a2f;
  --orange-bg: rgba(255,122,47,.09);
  --orange-bd: rgba(255,122,47,.24);

  --r1: 6px; --r2: 10px; --r3: 14px; --r4: 20px;
  --sidebar: 270px;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --sh:    0 4px 20px rgba(0,0,0,.5);
  --sh-lg: 0 16px 56px rgba(0,0,0,.72);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--sans); background: var(--bg); color: var(--t1); min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--s5); border-radius: 99px; }
button { font-family: var(--sans); }
input, textarea, select { font-family: var(--sans); }

/* ══════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════ */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100vh; overflow: hidden; }
.sidebar {
  background: var(--s1); border-right: 1px solid var(--b1);
  display: flex; flex-direction: column; overflow: hidden;
  position: relative; z-index: 10;
}
.sidebar::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--amber) 0%, transparent 70%);
  pointer-events: none;
}
.main { overflow-y: auto; background: var(--bg); }

/* ══════════════════════════════════════════════
   BRAND
══════════════════════════════════════════════ */
.brand { padding: 14px 14px 12px; border-bottom: 1px solid var(--b1); flex-shrink: 0; }
.brand-row { display: flex; align-items: center; gap: 9px; }
.brand-mark {
  width: 28px; height: 28px; background: var(--amber); border-radius: var(--r1);
  display: flex; align-items: center; justify-content: center;
  font-size: .78rem; flex-shrink: 0; box-shadow: 0 0 14px rgba(240,165,0,.25);
}
.brand-name { font-size: .86rem; font-weight: 700; color: var(--t1); line-height: 1.1; }
.brand-meta { font-family: var(--mono); font-size: .58rem; color: var(--t3); letter-spacing: .06em; margin-top: 1px; }

/* ══════════════════════════════════════════════
   DROPDOWN BLOCKS
══════════════════════════════════════════════ */
.sb-block { padding: 9px 10px 0; flex-shrink: 0; position: relative; }
.sb-block + .sb-block { border-top: 1px solid var(--b1); padding-top: 9px; }
.sb-lbl { font-family: var(--mono); font-size: .59rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--t3); margin-bottom: 5px; padding: 0 2px; }

.dd-trigger {
  width: 100%; background: var(--s2); border: 1px solid var(--b2); color: var(--t1);
  border-radius: var(--r1); padding: 7px 10px; text-align: left; cursor: pointer;
  font-size: .8rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
  gap: 6px; transition: border-color .12s, background .12s; overflow: hidden; margin-bottom: 8px;
}
.dd-trigger:hover { border-color: var(--b3); background: var(--s3); }
.dd-trigger.open { border-color: var(--amber-bd); background: var(--amber-bg); color: var(--amber); }
.dd-val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.dd-val.empty { color: var(--t3); font-weight: 400; }
.dd-caret { font-size: .64rem; color: var(--t3); flex-shrink: 0; transition: transform .15s; }
.dd-trigger.open .dd-caret { transform: rotate(180deg); color: var(--amber); }

.dd-panel {
  display: none; position: absolute; left: 10px; right: 10px;
  background: var(--s2); border: 1px solid var(--b3); border-radius: var(--r2);
  box-shadow: var(--sh-lg); z-index: 50; overflow: hidden;
  animation: ddIn .12s ease;
}
.dd-panel.open { display: block; }
@keyframes ddIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

.dd-item {
  display: flex; align-items: center; padding: 8px 10px; cursor: pointer; gap: 7px;
  transition: background .1s; border-bottom: 1px solid var(--b1);
}
.dd-item:last-child { border-bottom: none; }
.dd-item:hover { background: var(--s3); }
.dd-item.active { background: var(--amber-bg); }
.dd-emoji { font-size: .9rem; flex-shrink: 0; }
.dd-name { flex: 1; font-size: .8rem; font-weight: 600; color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-item.active .dd-name { color: var(--amber); }
.dd-dot { width: 5px; height: 5px; border-radius: 99px; background: var(--amber); flex-shrink: 0; opacity: 0; }
.dd-item.active .dd-dot { opacity: 1; }
.dd-acts { display: flex; gap: 3px; flex-shrink: 0; }
.dd-act {
  width: 22px; height: 22px; background: transparent; border: none; border-radius: var(--r1);
  color: var(--t3); cursor: pointer; font-size: .7rem;
  display: flex; align-items: center; justify-content: center; transition: background .1s, color .1s;
}
.dd-act:hover { background: var(--s4); color: var(--t1); }
.dd-act.del:hover { background: var(--red-bg); color: var(--red); }
.dd-empty { padding: 11px 10px; font-size: .75rem; color: var(--t3); text-align: center; font-style: italic; }
.dd-create {
  display: flex; align-items: center; gap: 7px; width: 100%;
  padding: 9px 10px; background: transparent; border: none; border-top: 1px solid var(--b1);
  cursor: pointer; color: var(--t2); font-size: .77rem; font-weight: 600;
  font-family: var(--sans); text-align: left; transition: background .1s, color .1s;
}
.dd-create:hover { background: var(--amber-bg); color: var(--amber); }

/* ══════════════════════════════════════════════
   CARDS LIST
══════════════════════════════════════════════ */
.sb-cards { flex: 1; overflow-y: auto; padding: 8px 10px; border-top: 1px solid var(--b1); }
.sb-cards-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.mono-lbl { font-family: var(--mono); font-size: .59rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--t3); }

.card-item { display: flex; align-items: center; gap: 4px; border-radius: var(--r1); padding: 1px 0 1px 2px; margin-bottom: 2px; transition: background .1s; }
.card-item:hover { background: var(--s2); }
.card-item.active { background: var(--amber-bg); }
.ci-name-btn {
  flex: 1; background: transparent; border: none; padding: 6px 7px; text-align: left; cursor: pointer;
  font-size: .79rem; font-weight: 500; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-radius: var(--r1); font-family: var(--sans); transition: color .1s;
}
.card-item:hover .ci-name-btn { color: var(--t1); }
.card-item.active .ci-name-btn { color: var(--amber); font-weight: 600; }
.ci-acts { display: none; gap: 2px; flex-shrink: 0; padding-right: 2px; }
.card-item:hover .ci-acts, .card-item.active .ci-acts { display: flex; }
.ci-act {
  width: 22px; height: 22px; background: transparent; border: none; border-radius: var(--r1);
  color: var(--t3); cursor: pointer; font-size: .7rem;
  display: flex; align-items: center; justify-content: center; transition: background .1s, color .1s;
}
.ci-act:hover { background: var(--s4); color: var(--t1); }
.ci-act.del:hover { background: var(--red-bg); color: var(--red); }

.new-card-btn {
  width: 100%; background: transparent; border: 1px dashed var(--b2); border-radius: var(--r1);
  padding: 7px 10px; cursor: pointer; color: var(--t3); font-size: .76rem;
  font-family: var(--sans); text-align: left; display: flex; align-items: center; gap: 6px;
  margin-top: 5px; transition: border-color .15s, color .15s;
}
.new-card-btn:hover { border-color: var(--amber-bd); color: var(--amber); }
.cards-empty { font-size: .73rem; color: var(--t3); line-height: 1.6; padding: 4px 2px; }

/* ══════════════════════════════════════════════
   SIDEBAR FOOTER
══════════════════════════════════════════════ */
.sb-footer { padding: 8px 10px; border-top: 1px solid var(--b1); flex-shrink: 0; }
.sb-nav {
  width: 100%; background: transparent; border: 1px solid transparent; border-radius: var(--r1);
  padding: 7px 10px; cursor: pointer; color: var(--t2); font-size: .79rem; font-weight: 500;
  font-family: var(--sans); text-align: left; display: flex; align-items: center; gap: 7px;
  margin-bottom: 2px; transition: all .1s;
}
.sb-nav:hover { background: var(--s2); color: var(--t1); border-color: var(--b1); }
.sb-nav.active { background: var(--blue-bg); border-color: var(--blue-bd); color: var(--blue); font-weight: 600; }

/* ══════════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px;
  border-radius: var(--r1); font-size: .75rem; font-weight: 600; cursor: pointer;
  border: 1px solid var(--b2); background: var(--s2); color: var(--t2);
  font-family: var(--sans); transition: all .1s; white-space: nowrap;
}
.btn:hover { background: var(--s3); border-color: var(--b3); color: var(--t1); transform: translateY(-1px); }
.btn:active { transform: none; }
.btn-primary { background: var(--amber); border-color: transparent; color: #07100a; font-weight: 700; }
.btn-primary:hover { background: var(--amber-l); color: #050d08; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--t3); }
.btn-ghost:hover { background: var(--s2); border-color: var(--b1); color: var(--t2); }
.btn-copy { background: var(--green-bg); border-color: var(--green-bd); color: var(--green); }
.btn-copy:hover { background: rgba(32,208,110,.15); }
.btn-danger { background: var(--red-bg); border-color: var(--red-bd); color: var(--red); }
.btn-danger:hover { background: rgba(255,67,86,.15); }
.btn-restore { background: var(--blue-bg); border-color: var(--blue-bd); color: var(--blue); }
.btn-restore:hover { background: rgba(74,158,255,.15); }
.btn-xs { padding: 4px 8px; font-size: .7rem; gap: 4px; }
.btn-sm { padding: 5px 10px; font-size: .74rem; }

/* ══════════════════════════════════════════════
   VIEWS
══════════════════════════════════════════════ */
.view { padding: 24px 28px 64px; max-width: 820px; }

/* Welcome */
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 48px 24px; text-align: center; }
.wc-badge { font-family: var(--mono); font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .2em; color: var(--amber); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.wc-badge::before, .wc-badge::after { content: ''; flex: 1; max-width: 60px; height: 1px; background: var(--amber-bd); }
.wc-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -.03em; margin-bottom: 8px; }
.wc-sub { font-size: .8rem; color: var(--t2); line-height: 1.6; max-width: 300px; margin-bottom: 28px; }
.wc-step { display: flex; align-items: flex-start; gap: 12px; background: var(--s1); border: 1px solid var(--b2); border-radius: var(--r2); padding: 13px 15px; text-align: left; max-width: 320px; margin-bottom: 9px; }
.wcs-n { font-family: var(--mono); font-size: .72rem; font-weight: 600; color: var(--amber); background: var(--amber-bg); border: 1px solid var(--amber-bd); border-radius: 99px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.wcs-title { font-size: .82rem; font-weight: 700; margin-bottom: 2px; }
.wcs-desc { font-size: .73rem; color: var(--t3); line-height: 1.4; }

/* Empty */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; text-align: center; }
.empty-gl { font-family: var(--mono); font-size: 1.6rem; color: var(--t4); margin-bottom: 14px; }
.empty-t { font-size: .9rem; font-weight: 700; color: var(--t2); margin-bottom: 7px; }
.empty-s { font-size: .77rem; color: var(--t3); line-height: 1.6; max-width: 250px; margin-bottom: 20px; }

/* Card view */
.card-header { border-bottom: 1px solid var(--b1); padding-bottom: 15px; margin-bottom: 16px; }
.card-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -.025em; margin-bottom: 7px; }
.card-app-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; background: var(--s2); border: 1px solid var(--b2); border-radius: 99px; font-family: var(--mono); font-size: .61rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--t2); margin-bottom: 10px; }
.card-note { background: var(--s1); border: 1px solid var(--b1); border-left: 2px solid var(--amber); border-radius: var(--r1); padding: 8px 12px; font-size: .77rem; color: var(--t2); line-height: 1.55; margin-bottom: 10px; }
.card-toolbar { display: flex; gap: 6px; flex-wrap: wrap; }

/* Fields */
.fields { display: flex; flex-direction: column; gap: 6px; }
.field-card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 10px 13px; transition: border-color .12s; }
.field-card:hover { border-color: var(--b2); }
.field-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.field-name { font-size: .83rem; font-weight: 700; margin-bottom: 2px; }
.field-type { font-family: var(--mono); font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); }
.field-btns { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
.field-val-row { display: flex; align-items: center; gap: 7px; }
.field-val { flex: 1; min-width: 0; font-family: var(--mono); font-size: .74rem; color: #96b8e4; background: #020507; border: 1px solid var(--b1); border-radius: var(--r1); padding: 6px 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: border-color .12s; }
.field-val:hover { border-color: var(--b2); }
.field-val.masked { letter-spacing: .1em; color: var(--t3); }
.field-note { margin-top: 6px; font-size: .71rem; color: var(--t3); font-style: italic; line-height: 1.4; }
.add-field-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; border: 1px dashed var(--b2); border-radius: var(--r2); background: transparent; cursor: pointer; color: var(--t3); font-size: .77rem; font-family: var(--sans); margin-top: 4px; transition: border-color .15s, color .15s; }
.add-field-row:hover { border-color: var(--amber-bd); color: var(--amber); }

/* Resources */
.res-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
.res-hd h2 { font-size: .94rem; font-weight: 700; }
.res-group { margin-bottom: 17px; }
.res-group-lbl { font-family: var(--mono); font-size: .59rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--t3); margin-bottom: 7px; display: flex; align-items: center; gap: 8px; }
.res-group-lbl::after { content: ''; flex: 1; height: 1px; background: var(--b1); }
.res-card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 10px 13px; margin-bottom: 5px; transition: border-color .12s; }
.res-card:hover { border-color: var(--b2); }
.res-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
.res-name { font-size: .81rem; font-weight: 700; margin-bottom: 2px; }
.res-badge { display: inline-flex; padding: 2px 7px; border-radius: 99px; font-family: var(--mono); font-size: .58rem; font-weight: 600; border: 1px solid var(--b1); background: var(--s2); color: var(--t3); text-transform: uppercase; letter-spacing: .06em; }
.res-btns { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
.res-val { font-family: var(--mono); font-size: .74rem; color: #96b8e4; background: #020507; border: 1px solid var(--b1); border-radius: var(--r1); padding: 6px 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-val.masked { letter-spacing: .1em; color: var(--t3); }
.res-note { margin-top: 6px; font-size: .71rem; color: var(--t3); font-style: italic; line-height: 1.4; }

/* ══════════════════════════════════════════════
   BACKUPS VIEW
══════════════════════════════════════════════ */
.bk-view h2 { font-size: .96rem; font-weight: 700; margin-bottom: 4px; }
.bk-view .bk-subtitle { font-size: .75rem; color: var(--t2); line-height: 1.5; margin-bottom: 16px; }

/* Storage bar */
.storage-bar-wrap { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 12px 14px; margin-bottom: 16px; }
.storage-bar-lbl { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.storage-bar-title { font-family: var(--mono); font-size: .62rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--t3); }
.storage-bar-num { font-family: var(--mono); font-size: .72rem; color: var(--t2); }
.storage-track { height: 6px; background: var(--s3); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
.storage-fill { height: 100%; border-radius: 99px; transition: width .3s, background .3s; }
.storage-fill.ok     { background: var(--green); }
.storage-fill.warn   { background: var(--orange); }
.storage-fill.danger { background: var(--red); }
.storage-meta { font-size: .71rem; color: var(--t3); }

/* Save now */
.bk-save-now { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

/* Import area */
.bk-import-panel { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 14px; margin-bottom: 16px; }
.bk-import-panel h3 { font-size: .83rem; font-weight: 700; margin-bottom: 10px; }
.io-box { width: 100%; min-height: 120px; background: #020507; border: 1px solid var(--b1); border-radius: var(--r1); color: #96b8e4; font-family: var(--mono); font-size: .7rem; padding: 10px; resize: vertical; line-height: 1.55; outline: none; transition: border-color .12s; }
.io-box:focus { border-color: var(--b2); }
.io-warn { background: var(--amber-bg); border: 1px solid var(--amber-bd); border-radius: var(--r1); padding: 8px 11px; font-size: .71rem; color: #b8880c; margin-top: 9px; line-height: 1.5; }

/* Backup section header */
.bk-section-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.bk-section-title { font-family: var(--mono); font-size: .62rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--t3); }
.bk-section-hd::after { content: ''; flex: 1; height: 1px; background: var(--b1); }
.bk-count { font-family: var(--mono); font-size: .62rem; color: var(--t3); background: var(--s2); border: 1px solid var(--b1); border-radius: 99px; padding: 1px 7px; }

/* Backup cards */
.bk-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.bk-card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); overflow: hidden; transition: border-color .12s; }
.bk-card:hover { border-color: var(--b2); }
.bk-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 11px 13px 9px; }
.bk-type-badge {
  display: inline-flex; padding: 2px 7px; border-radius: 99px; flex-shrink: 0;
  font-family: var(--mono); font-size: .6rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
}
.bk-type-badge.auto   { background: var(--blue-bg); border: 1px solid var(--blue-bd); color: var(--blue); }
.bk-type-badge.manual { background: var(--green-bg); border: 1px solid var(--green-bd); color: var(--green); }
.bk-label { font-size: .82rem; font-weight: 700; color: var(--t1); margin-bottom: 3px; }
.bk-date { font-family: var(--mono); font-size: .65rem; color: var(--t3); }
.bk-stats { display: flex; gap: 10px; padding: 0 13px 9px; flex-wrap: wrap; }

<script>
/* ══════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════ */
const APP_NAME    = "StreamConfigs Hub";
const APP_VERSION = "0.8.1";
const APP_DATE    = "2026-05-14";
const APP_AUTHOR  = "tiiiit74";

const STORE_ACTIVE  = 'confighub_active';
const STORE_BACKUPS = 'confighub_backups';
const STORE_ONBOARD = 'confighub_onboarding';
const SCHEMA_VERSION = 1;
const MAX_AUTO_BACKUPS = 10;
const WARN_MANUAL_BACKUPS = 30;
const WARN_STORAGE_BYTES = 3 * 1024 * 1024;   // 3 MB
const EST_MAX_BYTES       = 4.5 * 1024 * 1024; // 4.5 MB safe

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid   = () => crypto.randomUUID();
const nowISO = () => new Date().toISOString();
const trunc  = (s,n=80) => { s=String(s??''); return s.length>n ? s.slice(0,n)+'…' : s; };

function fmtDate(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtBytes(b) {
  if (b < 1024) return b+'o';
  if (b < 1024*1024) return (b/1024).toFixed(1)+' Ko';
  return (b/1024/1024).toFixed(2)+' Mo';
}

let _tt;
function showToast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type==='err' ? ' err' : type==='info' ? ' info' : '');
  clearTimeout(_tt); _tt = setTimeout(()=>el.classList.remove('show'), 2400);
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); showToast(`${label} copié ✓`); }
  catch { showToast('Copie impossible','err'); }
}

/* ══════════════════════════════════════════════
   EMPTY DB
══════════════════════════════════════════════ */
const EMPTY_ACTIVE = () => ({
  version: APP_VERSION,
  activeProfileId: null,
  activeApplicationId: null,
  activeCardId: null,
  activeView: 'card',
  profiles: [],
  applications: [],
  cards: [],
  resources: []
});

/* ══════════════════════════════════════════════
   STORAGE : TWO-KEY ARCHITECTURE
══════════════════════════════════════════════ */
let db = {};
let backups = [];

function loadData() {
  // Load active
  try {
    const raw = localStorage.getItem(STORE_ACTIVE);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.profiles) && Array.isArray(p.applications)
          && Array.isArray(p.cards) && Array.isArray(p.resources)) {
        db = p; db.version = APP_VERSION;
      } else { db = EMPTY_ACTIVE(); }
    } else { db = EMPTY_ACTIVE(); }
  } catch(_) { db = EMPTY_ACTIVE(); }

  // Load backups
  try {
    const raw = localStorage.getItem(STORE_BACKUPS);
    if (raw) {
      const p = JSON.parse(raw);
      backups = Array.isArray(p) ? p : [];
    } else { backups = []; }
  } catch(_) { backups = []; }
}

function saveActive() {
  try {
    const s = JSON.stringify(db);
    localStorage.setItem(STORE_ACTIVE, s);
    // Read-back verification
    const verify = localStorage.getItem(STORE_ACTIVE);
    if (!verify) throw new Error('write failed');
  } catch(e) {
    showToast('Sauvegarde impossible - stockage plein ?','err');
  }
}

function saveBackups() {
  try {
    const s = JSON.stringify(backups);
    localStorage.setItem(STORE_BACKUPS, s);
  } catch(e) {
    showToast('Impossible de sauvegarder l\'historique - stockage plein','err');
    return false;
  }
  return true;
}

/* ══════════════════════════════════════════════
   BACKUP ENGINE
══════════════════════════════════════════════ */
function computeStats(data) {
  const str = JSON.stringify(data);
  return {
    profiles:     (data.profiles||[]).length,
    applications: (data.applications||[]).length,
    cards:        (data.cards||[]).length,
    resources:    (data.resources||[]).length,
    sizeBytes:    new TextEncoder().encode(str).length
  };
}

function createBackup(type, label) {
  const dataCopy = JSON.parse(JSON.stringify(db));
  const auto_label = `${type==='manual'?'Sauvegarde manuelle':'Auto-sauvegarde'} | v${APP_VERSION} | ${fmtDate(nowISO())}`;
  const bk = {
    id: uid(),
    label: label || auto_label,
    backupType: type,
    appVersion: APP_VERSION,
    schemaVersion: SCHEMA_VERSION,
    createdAt: nowISO(),
    stats: computeStats(dataCopy),
    data: dataCopy
  };

  // Rotate auto backups if needed (never touch manual)
  if (type === 'auto') {
    const autos = backups.filter(b=>b.backupType==='auto').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    while (autos.length >= MAX_AUTO_BACKUPS) {
      const oldest = autos.shift();
      backups = backups.filter(b=>b.id!==oldest.id);
    }
  }

  backups.unshift(bk); // newest first
  const ok = saveBackups();
  return ok ? bk : null;
}

function autoBackupBefore(reason) {
  const label = `${reason} | v${APP_VERSION} | ${fmtDate(nowISO())}`;
  const bk = createBackup('auto', label);
  if (bk) showToast('Sauvegarde auto créée ✓', 'info');
  return bk;
}

function storageUsedBytes() {
  let total = 0;
  try { total += new TextEncoder().encode(localStorage.getItem(STORE_ACTIVE)||'').length; } catch(_){}
  try { total += new TextEncoder().encode(localStorage.getItem(STORE_BACKUPS)||'').length; } catch(_){}
  return total;
}

function openSaveNow() {

  openModal('Sauvegarder maintenant', `

    </div>`);
  setTimeout(()=>document.getElementById('bk-label')?.select(), 80);
}

function doSaveNow() {
  const label = document.getElementById('bk-label').value.trim();
  const bk = createBackup('manual', label||undefined);
  closeModal();
  if (bk) { showToast('Sauvegarde créée ✓'); renderAll(); }

}

function openRestoreBackup(id) {
  const bk = backups.find(b=>b.id===id); if(!bk) return;
  openModal('Restaurer cette sauvegarde', `
    <p style="font-size:.8rem;color:var(--t2);margin-bottom:14px;line-height:1.6">
      <strong style="color:var(--t1)">${esc(bk.label)}</strong><br>
      ${fmtDate(bk.createdAt)} | ${bk.stats.profiles} profil(s), ${bk.stats.cards} fiche(s)
    </p>
    <p style="font-size:.78rem;color:var(--red);margin-bottom:16px">⚠ Restaurer va écraser les données actives actuelles.</p>
    <div class="restore-opts">
      <div class="restore-opt primary" onclick="doRestore('${esc(id)}','save_first')">
        <span class="ro-icon">🛡</span>
        <div><div class="ro-title">Sauvegarder puis restaurer</div><div class="ro-desc">Sauvegarde l'état actuel avant de restaurer. Recommandé.</div></div>
      </div>
      <div class="restore-opt" onclick="doRestore('${esc(id)}','direct')">
        <span class="ro-icon">📥</span>
        <div><div class="ro-title">Restaurer sans sauvegarder</div><div class="ro-desc">Restaure directement. L'état actuel sera perdu.</div></div>
      </div>
      <div class="restore-opt" onclick="closeModal()">
        <span class="ro-icon">✕</span>
        <div><div class="ro-title">Annuler</div><div class="ro-desc">Ne rien changer.</div></div>
      </div>
    </div>`);
}

function doRestore(id, mode) {
  const bk = backups.find(b=>b.id===id); if(!bk) return;
  if (mode==='save_first') {
    const snap = createBackup('auto', `Avant restauration | v${APP_VERSION} | ${fmtDate(nowISO())}`);
    if (!snap) { showToast('Impossible de créer la sauvegarde de protection - annulé','err'); return; }
  }
  db = JSON.parse(JSON.stringify(bk.data));
  db.version = APP_VERSION;
  saveActive();
  closeModal();
  renderAll();
  showToast('Restauration réussie ✓');
}

function downloadActiveJSON() {
  const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`confighub_active_${APP_VERSION}_${APP_DATE}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function importJSON() {
  const box = document.getElementById('import-box');
  if (!box?.value.trim()){showToast('Aucune donnée à importer','err');return;}
  try {
    const p = JSON.parse(box.value.trim());
    if (!p.version||!Array.isArray(p.profiles)||!Array.isArray(p.applications)
        ||!Array.isArray(p.cards)||!Array.isArray(p.resources)) {
      showToast('JSON invalide - structure incorrecte','err'); return;
    }
    if (!confirm(`Importer ce JSON (v${p.version}) ?\n\nUne sauvegarde auto sera créée avant. Les données actives seront remplacées.`)) return;
    // Auto-backup before import
    const snap = createBackup('auto', `Avant import JSON | v${APP_VERSION} | ${fmtDate(nowISO())}`);
    if (!snap) { showToast('Impossible de créer la sauvegarde de protection - annulé','err'); return; }
    db = p; db.version = APP_VERSION;
    saveActive(); renderAll();
    showToast('Import réussi ✓');
  } catch(_) { showToast('Erreur de parsing JSON','err'); }
}

function downloadBackupJSON(id) {
  const bk=backups.find(b=>b.id===id); if(!bk) return;
  const blob=new Blob([JSON.stringify(bk,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`confighub_backup_${bk.backupType}_${APP_DATE}_${bk.id.slice(0,8)}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function copyBackupJSON(id) {
  const bk=backups.find(b=>b.id===id); if(!bk) return;
  copyText(JSON.stringify(bk,null,2), 'Sauvegarde JSON');
}

function deleteBackup(id) {
  const bk=backups.find(b=>b.id===id); if(!bk) return;
  if(!confirm(`Supprimer la sauvegarde "${bk.label}" ?\n\nIrréversible.`)) return;
  backups=backups.filter(b=>b.id!==id);
  saveBackups(); renderAll(); showToast('Sauvegarde supprimée');
}

function resetActiveData() {
  if(!confirm(`Réinitialiser toutes les données actives ?\n\n→ Tous les profils, applications, fiches et ressources seront effacés.\n→ Les sauvegardes ne seront PAS supprimées.\n\nIrréversible.`)) return;
  db = EMPTY_ACTIVE();
  saveActive(); renderAll(); showToast('Données actives réinitialisées');
}

function deleteAllBackups() {
  if(!confirm(`Effacer toutes les sauvegardes (${backups.length}) ?\n\nLes données actives ne seront PAS affectées.\nIrréversible.`)) return;
  backups=[];
  saveBackups(); renderAll(); showToast('Toutes les sauvegardes effacées');
}

  const t=nowISO(); const id=uid();
  let fields=[];
  if(type==='standard') fields=[
    {id:uid(),name:'UUID',        type:'UUID',        value:'',hidden:false,note:''},
    {id:uid(),name:'Mot de passe',type:'Mot de passe',value:'',hidden:true, note:''},

  const card=db.cards.find(c=>c.id===cardId); if(!card) return;

  db.cards.push(copy); db.activeCardId=copy.id;
  saveActive(); renderAll(); showToast('Fiche dupliquée');

function toggleCFT(p) {
  const s=document.getElementById(`${p}-type`),w=document.getElementById(`${p}-cw`);
  if(s&&w) w.style.display=s.value==='Type personnalisé'?'block':'none';
}

function prefillFromRes(resId) {
  const r=db.resources.find(x=>x.id===resId); if(!r) return;
  const n=document.getElementById('af-name'),v=document.getElementById('af-value'),
        nt=document.getElementById('af-note'),h=document.getElementById('af-hidden'),t=document.getElementById('af-type');
  if(n) n.value=r.name; if(v) v.value=r.value; if(nt) nt.value=r.note||''; if(h) h.checked=r.hidden;
  if(t){const m=FTYPES.find(x=>x.toLowerCase()===r.category.toLowerCase());t.value=m||'Type personnalisé';if(!m){const w=document.getElementById('af-cw'),c=document.getElementById('af-ct');if(w)w.style.display='block';if(c)c.value=r.category;}toggleCFT('af');}
  showToast(`Prérempli depuis "${esc(r.name)}"`);
}

function saveAddField(cardId) {
  const card=db.cards.find(c=>c.id===cardId); if(!card) return;
  const name=document.getElementById('af-name').value.trim();
  if(!name){showToast('Nom obligatoire','err');return;}
  let type=document.getElementById('af-type').value;
  if(type==='Type personnalisé') type=document.getElementById('af-ct').value.trim()||'Personnalisé';
  card.fields.push({id:uid(),name,type,value:document.getElementById('af-value').value,note:document.getElementById('af-note').value.trim(),hidden:document.getElementById('af-hidden').checked});
  card.updatedAt=nowISO(); saveActive(); closeModal(); renderAll(); showToast(`"${esc(name)}" ajouté`);
}

    <div class="modal-ft">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary btn-sm" onclick="saveEditField('${esc(cardId)}','${esc(fieldId)}')">Enregistrer</button>
    </div>`);
}

function saveEditField(cardId,fieldId) {
  const card=db.cards.find(c=>c.id===cardId); if(!card) return;
  const f=card.fields.find(x=>x.id===fieldId); if(!f) return;
  const name=document.getElementById('ef-name').value.trim();
  if(!name){showToast('Nom obligatoire','err');return;}
  let type=document.getElementById('ef-type').value;
  if(type==='Type personnalisé') type=document.getElementById('ef-ct').value.trim()||'Personnalisé';
  f.name=name;f.type=type;f.value=document.getElementById('ef-value').value;f.note=document.getElementById('ef-note').value.trim();f.hidden=document.getElementById('ef-hidden').checked;
  card.updatedAt=nowISO(); saveActive(); closeModal(); renderAll(); showToast('Information mise à jour');
}

function copyFieldVal(cId,fId){const card=db.cards.find(c=>c.id===cId);if(!card)return;const f=card.fields.find(x=>x.id===fId);if(!f)return;copyText(f.value,f.name);}
function toggleField(cId,fId){const card=db.cards.find(c=>c.id===cId);if(!card)return;const f=card.fields.find(x=>x.id===fId);if(!f)return;f.hidden=!f.hidden;saveActive();renderAll();}
function deleteField(cId,fId){const card=db.cards.find(c=>c.id===cId);if(!card)return;const f=card.fields.find(x=>x.id===fId);if(!f)return;if(!confirm(`Supprimer "${f.name}" ?`))return;card.fields=card.fields.filter(x=>x.id!==fId);card.updatedAt=nowISO();saveActive();renderAll();showToast('Information supprimée');}

function saveAddRes() {

    <div class="fg-row">

      <div class="fg"><label>Catégorie</label><input type="text" id="er-cat" value="${esc(r.category)}" list="er-cats"><datalist id="er-cats">${RES_CATS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>

      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Annuler</button>

function saveEditRes(resId) {
  const r=db.resources.find(x=>x.id===resId); if(!r) return;

  if(!name){showToast('Nom obligatoire','err');return;}

function copyResVal(id){const r=db.resources.find(x=>x.id===id);if(!r)return;copyText(r.value,r.name);}
function toggleRes(id){const r=db.resources.find(x=>x.id===id);if(!r)return;r.hidden=!r.hidden;saveActive();renderAll();}
function deleteRes(id){const r=db.resources.find(x=>x.id===id);if(!r)return;if(!confirm(`Supprimer "${r.name}" ?`))return;db.resources=db.resources.filter(x=>x.id!==id);saveActive();renderAll();showToast('Ressource supprimée');}

function checkOnboarding() {
  const seen = localStorage.getItem(STORE_ONBOARD);

  }
}
